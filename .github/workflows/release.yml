name: Build and Release QPKG

on:
  # Cut the release in the GitHub UI (or `gh release create`); this attaches the
  # QPKG to it. `published` rather than `created` so that publishing a draft, which
  # only fires `published`, is not silently ignored.
  release:
    types: [published]
  # Build-only smoke test. Leaves the artifact on the run; never touches a release.
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild Docker image (bypass cache)'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Build exactly what was tagged. Empty on workflow_dispatch, where
          # checkout falls back to the ref the run was started from.
          ref: ${{ github.event.release.tag_name }}

      - name: Load versions from versions.yml
        id: get_version
        run: |
          # Read versions from versions.yml. The Realtek driver version is NOT here -
          # build_driver.sh reads it out of the source it downloads and writes it to
          # output/driver/driver_version, which is what the QPKG is stamped with.
          KERNEL_VERSION=$(grep 'kernel_version:' versions.yml | head -1 | sed 's/.*kernel_version:[[:space:]]*"\(.*\)".*/\1/' | tr -d '"' | tr -d "'")
          QTS_VERSION=$(grep 'qts_version:' versions.yml | sed 's/.*qts_version:[[:space:]]*"\(.*\)".*/\1/' | tr -d '"' | tr -d "'")

          # Target platform (same keys build.sh reads)
          read_key() {
            grep "^$1:" versions.yml | sed "s/^$1:[[:space:]]*\"\(.*\)\".*/\1/" | tr -d '"' | tr -d "'"
          }
          TARGET_MODEL=$(read_key target_model)
          KERNEL_CONFIG_FILE=$(read_key kernel_config)
          KERNEL_ARCH=$(read_key kernel_arch)
          CROSS_COMPILE_PREFIX=$(read_key cross_compile)
          QPKG_ARCH=$(read_key qpkg_arch)
          KERNEL_SERIES=$(echo "$KERNEL_VERSION" | cut -d. -f1-2)

          # Cache key for the build image. The image holds only the cross toolchain
          # and the built kernel tree - the driver source is fetched at `docker run`
          # time - so the driver release is deliberately not part of this.
          DOCKER_TAG="qts-${QTS_VERSION}-kernel-${KERNEL_VERSION}-${KERNEL_ARCH}"

          echo "target_model=$TARGET_MODEL" >> $GITHUB_OUTPUT
          echo "kernel_config_file=$KERNEL_CONFIG_FILE" >> $GITHUB_OUTPUT
          echo "kernel_arch=$KERNEL_ARCH" >> $GITHUB_OUTPUT
          echo "cross_compile_prefix=$CROSS_COMPILE_PREFIX" >> $GITHUB_OUTPUT
          echo "qpkg_arch=$QPKG_ARCH" >> $GITHUB_OUTPUT
          echo "kernel_series=$KERNEL_SERIES" >> $GITHUB_OUTPUT

          echo "kernel_version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "qts_version=$QTS_VERSION" >> $GITHUB_OUTPUT
          echo "docker_tag=$DOCKER_TAG" >> $GITHUB_OUTPUT

          echo "Building for: $TARGET_MODEL ($KERNEL_ARCH)"
          echo "  Kernel: $KERNEL_VERSION"
          echo "  QTS: $QTS_VERSION"
          echo "  Docker tag: $DOCKER_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache GPL source
        if: github.event.inputs.force_rebuild != 'true'
        uses: actions/cache@v6
        with:
          path: GPL_QTS/
          key: gpl-${{ hashFiles('versions.yml') }}
          restore-keys: gpl-

      - name: Cache Docker layers
        if: github.event.inputs.force_rebuild != 'true'
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ steps.get_version.outputs.docker_tag }}
          restore-keys: |
            buildx-qts-${{ steps.get_version.outputs.qts_version }}-

      - name: Prepare GPL source
        run: ./prepare_gpl_source.sh

      - name: Build Docker image with cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rtl8125-builder:${{ steps.get_version.outputs.docker_tag }}
          build-args: |
            TARGET_MODEL=${{ steps.get_version.outputs.target_model }}
            KERNEL_SERIES=${{ steps.get_version.outputs.kernel_series }}
            KERNEL_CONFIG_FILE=${{ steps.get_version.outputs.kernel_config_file }}
            KERNEL_VERSION=${{ steps.get_version.outputs.kernel_version }}
            KERNEL_ARCH=${{ steps.get_version.outputs.kernel_arch }}
            CROSS_COMPILE_PREFIX=${{ steps.get_version.outputs.cross_compile_prefix }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build driver
        id: build_driver
        run: |
          export DOCKER_TAG="${{ steps.get_version.outputs.docker_tag }}"
          bash build.sh driver
          # Written by build_driver.sh from RTL8125_VERSION in the source it compiled
          echo "driver_version=$(cat output/driver/driver_version)" >> $GITHUB_OUTPUT

      - name: Create QPKG
        run: |
          export DOCKER_TAG="${{ steps.get_version.outputs.docker_tag }}"
          bash build.sh qpkg

      - name: Move cache
        if: github.event.inputs.force_rebuild != 'true'
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: List built artifacts
        if: always()
        run: |
          echo "Built artifacts:"
          echo "================"
          if [ -d "output" ]; then
            echo "Output directory structure:"
            find output -type f -exec ls -lh {} \;
            echo ""
            echo "Summary:"
            ls -lh output/ 2>/dev/null || echo "No files in output/"
            ls -lh output/driver/ 2>/dev/null || echo "No driver files"
            ls -lh output/*.qpkg 2>/dev/null || echo "No QPKG files"
          else
            echo "ERROR: output directory does not exist"
          fi

      - name: Upload QPKG to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          # Attach to the release that triggered this run. name/body/prerelease are
          # deliberately not set: the action preserves whatever the release already
          # has when they are omitted, so the notes written by hand survive.
          tag_name: ${{ github.event.release.tag_name }}
          files: output/*.qpkg

      - name: Upload build artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: qpkg-${{ steps.build_driver.outputs.driver_version || github.run_id }}
          path: output/*.qpkg
          # 90 is the ceiling for a public repo on a personal account
          retention-days: 90
