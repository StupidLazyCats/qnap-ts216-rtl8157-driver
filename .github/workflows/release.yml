name: Build TS-216 RTL8157 driver

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Ignore saved Docker layer cache
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read build configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          read_key() {
            grep "^$1:" versions.yml | sed "s/^$1:[[:space:]]*\"\(.*\)\".*/\1/" | tr -d "'"
          }

          KERNEL_VERSION=$(sed -n 's/.*kernel_version:[[:space:]]*"\([^"]*\)".*/\1/p' versions.yml | head -1)
          QTS_VERSION=$(sed -n 's/.*qts_version:[[:space:]]*"\([^"]*\)".*/\1/p' versions.yml | head -1)
          TARGET_MODEL=$(read_key target_model)
          KERNEL_CONFIG=$(read_key kernel_config)
          KERNEL_ARCH=$(read_key kernel_arch)
          CROSS_COMPILE=$(read_key cross_compile)
          QPKG_ARCH=$(read_key qpkg_arch)
          KERNEL_SERIES=$(cut -d. -f1-2 <<< "${KERNEL_VERSION}")
          DOCKER_TAG="qts-${QTS_VERSION}-kernel-${KERNEL_VERSION}-${TARGET_MODEL}-${KERNEL_ARCH}"

          for value in KERNEL_VERSION QTS_VERSION TARGET_MODEL KERNEL_CONFIG KERNEL_ARCH CROSS_COMPILE QPKG_ARCH; do
            if [ -z "${!value}" ]; then
              echo "Missing ${value} in versions.yml" >&2
              exit 1
            fi
          done

          {
            echo "kernel_version=${KERNEL_VERSION}"
            echo "qts_version=${QTS_VERSION}"
            echo "target_model=${TARGET_MODEL}"
            echo "kernel_config=${KERNEL_CONFIG}"
            echo "kernel_arch=${KERNEL_ARCH}"
            echo "cross_compile=${CROSS_COMPILE}"
            echo "qpkg_arch=${QPKG_ARCH}"
            echo "kernel_series=${KERNEL_SERIES}"
            echo "docker_tag=${DOCKER_TAG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Cache extracted QNAP GPL source
        if: inputs.force_rebuild != true
        uses: actions/cache@v4
        with:
          path: GPL_QTS
          key: qnap-gpl-${{ hashFiles('versions.yml', 'prepare_gpl_source.sh') }}

      - name: Download and extract QNAP GPL source
        run: ./prepare_gpl_source.sh

      - name: Validate TS-X16 kernel config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="GPL_QTS/kernel_cfg/${{ steps.config.outputs.target_model }}/${{ steps.config.outputs.kernel_config }}"
          if [ ! -f "${CONFIG}" ]; then
            echo "Expected kernel config is missing: ${CONFIG}" >&2
            echo "Available ARM64 5.10 configs:" >&2
            find GPL_QTS/kernel_cfg -type f -name '*5.10*arm64*' -print 2>/dev/null | sort >&2 || true
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache prepared kernel layers
        if: inputs.force_rebuild != true
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: kernel-${{ steps.config.outputs.docker_tag }}-${{ hashFiles('Dockerfile', 'build_kernel.sh') }}
          restore-keys: |
            kernel-${{ steps.config.outputs.docker_tag }}-

      - name: Build prepared-kernel image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rtl8152-builder:${{ steps.config.outputs.docker_tag }}
          build-args: |
            TARGET_MODEL=${{ steps.config.outputs.target_model }}
            KERNEL_SERIES=${{ steps.config.outputs.kernel_series }}
            KERNEL_CONFIG_FILE=${{ steps.config.outputs.kernel_config }}
            KERNEL_VERSION=${{ steps.config.outputs.kernel_version }}
            KERNEL_ARCH=${{ steps.config.outputs.kernel_arch }}
            CROSS_COMPILE_PREFIX=${{ steps.config.outputs.cross_compile }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Compile and verify r8152.ko
        id: driver
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_TAG="${{ steps.config.outputs.docker_tag }}"
          ./build.sh driver
          echo "version=$(cat output/driver/driver_version)" >> "${GITHUB_OUTPUT}"

      - name: Package QPKG
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_TAG="${{ steps.config.outputs.docker_tag }}"
          ./build.sh qpkg

      - name: Show produced files
        if: always()
        run: find output -maxdepth 3 -type f -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload module, metadata, and QPKG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts216-rtl8157-${{ steps.driver.outputs.version || github.run_id }}
          path: |
            output/driver/r8152.ko
            output/driver/module_info.txt
            output/driver/driver_version
            output/driver/r8152.ko.sha256
            output/*.qpkg
          if-no-files-found: warn
          retention-days: 30

      - name: Replace Docker cache
        if: always() && inputs.force_rebuild != true
        shell: bash
        run: |
          if [ -d /tmp/.buildx-cache-new ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi
