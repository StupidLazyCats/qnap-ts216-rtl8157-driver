# Name of the packaged application.
QPKG_NAME="RTL8152_Driver"
# Name of the display application.
QPKG_DISPLAY_NAME="Realtek USB Ethernet Driver (RTL8152-RTL8157)"
# Version of the packaged application.
QPKG_VER="2.20.1"
# Author or maintainer of the package
QPKG_AUTHOR="Community build"
# License for the packaged application
QPKG_LICENSE="GPL"
# One-line description of the packaged application
QPKG_SUMMARY="Realtek r8152 USB Ethernet driver with RTL8157 support for QNAP arm64"

# Preferred number in start/stop sequence.
QPKG_RC_NUM="101"
# Init-script used to control the start and stop of the installed application.
QPKG_SERVICE_PROGRAM="RTL8152_Driver.sh"

# Specifies any packages required for the current package to operate.
#QPKG_REQUIRE=""
# Specifies what packages cannot be installed if the current package is to operate properly.
#QPKG_CONFLICT=""

# Minimum QTS version requirement
QTS_MINI_VERSION="5.2.0"
# Maximum QTS version requirement
QTS_MAX_VERSION="9.9.9"

# Set icons directory
QPKG_ICONS="icons"

# Web interface settings
QPKG_WEBUI="/"
QPKG_WEB_PORT=""
QPKG_SERVICE_PORT=""

# Volume settings - 0 means no volume selection required
QPKG_VOLUME_SELECT="0"

# "start_timeout,stop_timeout" in seconds. The bare "0" that used to be here does
# not match that format and asked QTS to wait zero seconds for the boot-time
# start, which loads a kernel module.
QPKG_TIMEOUT="30,30"
